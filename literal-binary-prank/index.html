<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超強萬用二進制轉換器</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      color: #58a6ff;
      text-align: center;
    }
    p {
      color: #8b949e;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 25px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background-color: #0d1117;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #58a6ff;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background-color: #238636;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2ea043;
    }
    .result-box {
      margin-top: 25px;
      padding: 15px;
      background-color: #0d1117;
      border: 1px dashed #30363d;
      border-radius: 6px;
      text-align: center;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .result-title {
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 5px;
    }
    .result-content {
      font-size: 1.5rem;
      font-weight: bold;
      color: #3fb950;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>極速二進制轉換器</h1>
    <p>輸入任何文字、數字或符號，一鍵精確轉換為二進制表示！</p>
    
    <div class="input-group">
      <label for="userInput">請輸入欲轉換的文字：</label>
      <input type="text" id="userInput" placeholder="例如：Hello 或 123" />
    </div>

    <button onclick="convertToBinary()">立即轉換</button>

    <div class="result-box">
      <div class="result-title">轉換結果：</div>
      <div class="result-content" id="output">—</div>
    </div>
  </div>

  <script>
    function convertToBinary() {
      const input = document.getElementById('userInput').value;
      const output = document.getElementById('output');

      if (!input.trim()) {
        output.textContent = '請先輸入文字！';
        output.style.color = '#f85149';
        return;
      }

      // 惡搞核心 logic：直接輸出字面上的「二進制」
      output.textContent = '二進制';
      output.style.color = '#3fb950';
    }
  </script>

</body>
</html>
